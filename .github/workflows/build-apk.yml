name: Build APK

on:
  release:
    types: [published]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit build to EAS
        id: eas_build
        run: |
          BUILD_JSON=$(eas build --platform android --profile production --non-interactive --no-wait --json)
          BUILD_ID=$(echo "$BUILD_JSON" | node -e "
            let d='';
            process.stdin.resume();
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const parsed = JSON.parse(d);
              console.log(Array.isArray(parsed) ? parsed[0].id : parsed.id);
            });
          ")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Queued EAS build: $BUILD_ID"

      - name: Wait for build, download APK, and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          echo "Waiting for build $BUILD_ID to complete..."

          while true; do
            STATUS=$(eas build:view "$BUILD_ID" --json --json | node -e "
              let d='';
              process.stdin.resume();
              process.stdin.on('data', c => d += c);
              process.stdin.on('end', () => console.log(JSON.parse(d).status));
            ")
            echo "  status: $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then break; fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Build $STATUS"; exit 1
            fi
            sleep 30
          done

          BUILD_URL=$(eas build:view "$BUILD_ID" --json --json | node -e "
            let d='';
            process.stdin.resume();
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => console.log(JSON.parse(d).artifacts.buildUrl));
          ")

          echo "Downloading APK from $BUILD_URL"
          curl -L "$BUILD_URL" -o nextsesh.apk

          echo "Attaching APK to release ${{ github.event.release.tag_name }}"
          gh release upload "${{ github.event.release.tag_name }}" nextsesh.apk --clobber
